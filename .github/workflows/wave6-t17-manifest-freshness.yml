# Волна ×6 · 6-D · repo-doctrine#24 — T17 «Манифест свежести: генерится, а не пишется».
# make manifest-check = пересборка в память + сравнение: манифеста нет, стёрта шапка
# GENERATED (ручная правка) или расхождение строк — красный с точным приговором.
# Живые файлы (PULSE.md, mutations.yaml, demo-badge.md — их ведут воркфлоу) вне
# заморозки, граница объявлена в шапке манифеста.
# Храповик: существующие workflows репо не тронуты, это отдельный новый гейт.
# Протокол тишины A-HUSH (волна ×1176, 2026-11-18): гейт получает грейс 3×60 с
# (гонка: манифест догоняет генератор — транзитное расхождение не тревога) и
# «тревогу однажды»: issue alarm:manifest открывается один раз, разряжается при
# зелёном такте.
name: wave6-t17-manifest-freshness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wave6-t17-manifest-freshness
  cancel-in-progress: false

jobs:
  manifest-freshness:
    name: manifest-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (пин по SHA — учитель OpenSSF Scorecard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: manifest-freshness — гейт «манифест генерится, а не пишется» (грейс A-HUSH)
        run: |
          for i in 1 2 3; do
            if make manifest-check; then echo "манифест свеж (попытка $i)"; exit 0; fi
            echo "манифест отстал — гонка с генератором? перепроверка через 60 с (попытка $i/3)"
            sleep 60
          done
          echo "манифест отстал надлого — честный красный"
          exit 2

      - name: Тесты манифеста — храповик, тесты только добавляются
        run: python3 -m unittest discover -s tests -p "test_manifest_check*.py" -v

      - name: Разоружение (манифест свеж — страж молчит и снова вооружён)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --label "alarm:manifest" --json number -q '.[].number' \
            | while read n; do gh issue close "$n" -R "$GITHUB_REPOSITORY" -c "манифест свеж (run ${{ github.run_id }}) — страж разряжен, тревога снята"; done

      - name: Тревога однажды (circuit breaker)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "alarm:manifest" -R "$GITHUB_REPOSITORY" --color b60205 --description "манифест отстал от генератора надлого" --force 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label "alarm:manifest" --json number -q 'length')
          if [ "$open" -eq 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              -t "ALARM: манифест отстал надлого" \
              -b "run ${{ github.run_id }} — manifest-check красный после 3 перепроверок. Пока issue открыта — страж молчит (протокол A-HUSH)." \
              -l "alarm:manifest"
          else
            echo "тревога уже открыта ($open) — молчим"
          fi
