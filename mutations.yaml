# ── Canon «Идемпотентность-храповик» · волна ×3, W3-E (предложение repo-doctrine#31) ──
# Правило трёх проходов для каждого мутатора:
#   (1) mutator --dry-run → отчёт диффа в job summary;
#   (2) после разбора отчёта — apply;
#   (3) контрольный --dry-run обязан показать 0 строк диффа, иначе гейт idempotency-gate
#       краснеет и заводится авто-issue инцидента.
# Храповик: применённый мутатор дописывается в canon_table и оттуда не удаляется;
# конфликты решаются добавлением новой записи, никогда правкой старой. Реестр только растёт.
# Каждая волна роя прикладывает к предложению готовую строку mutators — строго дополнением.
# Схема: плоские записи со скалярными полями; пустые поля "" заполняются скриптом
# canonical_check.py при первом прогоне (заполненное поле не перезаписывается).
version: 1
mutators:
  - name: demo-badge-append
    repo: rtynbirf/repo-doctrine
    script: scripts/canonical_check.py
    call: demo
    target: demo-badge.md
    applied: true
    dry_run_1: "2026-11-08T19:13:11Z дифф: 1 строк"
    apply: "2026-11-08T19:13:11Z apply"
    dry_run_2: "2026-11-08T19:13:11Z дифф: 0 строк"
canon_table: []
